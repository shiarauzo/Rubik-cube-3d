<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4ee" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self' https://cdn.jsdelivr.net;
      media-src 'self' blob:;
    " />
    <title>Rubik 3D · Computer Vision</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/hud/hud.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="three-canvas" aria-label="Vista 3D interactiva del cubo de Rubik. Usa el ratón para rotar la vista o el teclado para mover las capas."></canvas>
      <div id="cv-layer" aria-label="Vista de cámara para modo AR">
        <video id="cv-video" playsinline muted></video>
        <canvas id="cv-overlay"></canvas>
        <div id="grid-overlay">
          <div class="grid-cell corner" data-row="0" data-col="0">
            <span class="cell-label">U·L</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell" data-row="0" data-col="1">
            <span class="cell-label">U·M</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell corner" data-row="0" data-col="2">
            <span class="cell-label">U·R</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell corner" data-row="1" data-col="0">
            <span class="cell-label">E·L</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell corner" data-row="1" data-col="1">
            <span class="cell-label">E·M</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell corner" data-row="1" data-col="2">
            <span class="cell-label">E·R</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell corner" data-row="2" data-col="0">
            <span class="cell-label">D·L</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell" data-row="2" data-col="1">
            <span class="cell-label">D·M</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
          <div class="grid-cell corner" data-row="2" data-col="2">
            <span class="cell-label">D·R</span>
            <span class="cell-arrows">←→ ↑↓</span>
          </div>
        </div>
        <div id="move-hint" class="move-hint"></div>
        <div id="drag-preview" class="drag-preview"></div>
      </div>
      <div id="hud-root"></div>
      <div id="toast" role="alert" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
