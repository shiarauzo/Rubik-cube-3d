<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4ee" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self' https://cdn.jsdelivr.net;
      media-src 'self' blob:;
    " />
    <title>Rubik 3D · Computer Vision</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/hud/hud.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="three-canvas" aria-label="Vista 3D interactiva del cubo de Rubik. Usa el ratón para rotar la vista o el teclado para mover las capas."></canvas>
      <div id="cv-layer" aria-label="Vista de cámara para modo AR">
        <video id="cv-video" playsinline muted></video>
        <canvas id="cv-overlay"></canvas>
        <div id="face-controls">
          <div id="color-bar">
            <button class="color-btn" data-face="R" style="--c: #b91c1c">
              <span class="color-name">roja</span>
            </button>
            <button class="color-btn" data-face="L" style="--c: #c2570c">
              <span class="color-name">naranja</span>
            </button>
            <button class="color-btn" data-face="D" style="--c: #d4a017">
              <span class="color-name">amarilla</span>
            </button>
            <button class="color-btn" data-face="F" style="--c: #4d7c0f">
              <span class="color-name">verde</span>
            </button>
            <button class="color-btn" data-face="B" style="--c: #1e40af">
              <span class="color-name">azul</span>
            </button>
            <button class="color-btn" data-face="U" style="--c: #f7f5ee">
              <span class="color-name">blanca</span>
            </button>
          </div>
          <div id="turn-controls">
            <button class="turn-btn" data-dir="ccw">↺</button>
            <button class="turn-btn" data-dir="cw">↻</button>
          </div>
        </div>
      </div>
      <div id="hud-root"></div>
      <div id="toast" role="alert" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
